# 示例配置仅含环境变量占位符，不含任何本机路径、内网 IP 或口令（落实 BE-CFG-001 & CMD-NP-12）
server:
  port: ${GROMA_SERVER_PORT:8080}
  tomcat:
    max-swallow-size: 10MB
    max-http-form-post-size: 10MB

spring:
  application:
    name: groma-simulation-service
  ai:
    mcp:
      server:
        enabled: true
        name: groma-model-service
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        request-timeout: 90s
        streamable-http:
          mcp-endpoint: /mcp

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

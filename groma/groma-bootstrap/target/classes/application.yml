# 严格遵守 CMD-NP-12 (CFG-01~05) 与 NP-R11/NP-R12：零盘符路径、零个人目录、零写死内网 IP、请求体显式上限！
server:
  port: ${GROMA_SERVER_PORT:8080}
  tomcat:
    max-swallow-size: 10MB
    max-http-form-post-size: 10MB

spring:
  application:
    name: groma-simulation-service
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  autoconfigure:
    exclude:
      # 连接器的数据源由管理员在运行期受控注册（AnyTableQueryConnector），宿主不需要启动期 DataSource
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.health.DataSourceHealthContributorAutoConfiguration
  kafka:
    bootstrap-servers: ${GROMA_KAFKA_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
  ai:
    mcp:
      server:
        enabled: true
        name: groma-model-mcp-server
        version: 1.0.0
        protocol: STREAMABLE
        type: SYNC
        request-timeout: 90s
        instructions: "先读资源 groma://models 了解已挂载模型与场景，再用 sim.* 管理会话或用 run.process 执行过程，用完调用 sim.stop。"
        streamable-http:
          mcp-endpoint: /mcp

groma:
  engine:
    event-loop-threads: ${GROMA_LOOP_THREADS:0}
    max-concurrent-sessions: ${GROMA_MAX_SESSIONS:200}
    max-events-per-step: ${GROMA_MAX_EVENTS_PER_STEP:100000}
    heartbeat-timeout-seconds: ${GROMA_HEARTBEAT_TIMEOUT_SEC:120}
  connector:
    http-read-timeout-ms: ${GROMA_HTTP_TIMEOUT_MS:60000}
    script-allowlist-dir: ${GROMA_SCRIPT_ALLOW_DIR:./scripts-sandbox}
    mcp-client-allowlist: ${GROMA_MCP_ALLOW_HOSTS:localhost}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
